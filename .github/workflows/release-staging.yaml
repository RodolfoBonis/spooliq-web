name: Release Staging

on:
  push:
    branches:
      - develop
      - 'release/**'
      - main
    paths-ignore:
      - 'package.json'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  AWS_REGION: 'sa-east-1'
  ECR_REPOSITORY: 'rodolfobonis/spooliq-web'

jobs:
  release-staging:
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/v')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate version
        id: version
        run: |
          TIMESTAMP=$(date +%s)
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            BRANCH_NAME=${GITHUB_REF#refs/heads/release/}
            VERSION="${BRANCH_NAME}-rc.${TIMESTAMP}"
          else
            VERSION="stg-${TIMESTAMP}-${SHORT_SHA}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "package_version=${PACKAGE_VERSION}" >> $GITHUB_OUTPUT
          echo "timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

          echo "Generated version: ${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.version }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:staging-latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.version.outputs.timestamp }}
            VERDACCIO_TOKEN=${{ secrets.VERDACCIO_TOKEN }}
            NEXT_PUBLIC_API_URL=https://api.spooliq.stg.rb.lab/v1
            NEXT_PUBLIC_CLIENT_ID=${{ secrets.SPOOLIQ_CLIENT_ID }}
            NEXT_PUBLIC_CLIENT_SECRET=${{ secrets.SPOOLIQ_CLIENT_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update K3s manifests
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git clone https://oauth2:${GH_TOKEN}@github.com/RodolfoBonis/k3s-apps.git
          cd k3s-apps

          # Install yq if not available
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          # Update the image tag in the staging values file (rb-stack format)
          yq e ".web-server.image.tag = \"${{ steps.version.outputs.version }}\"" -i ./apps/spooliq-web/values-stg.yaml

          git add ./apps/spooliq-web/values-stg.yaml
          git commit -m "chore(spooliq-web): update staging image to ${{ steps.version.outputs.version }}"
          git push

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          rm argocd-linux-amd64

      - name: Deploy to staging
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          argocd app sync spooliq-stg \
            --server ${ARGOCD_SERVER} \
            --auth-token ${ARGOCD_AUTH_TOKEN} \
            --grpc-web

          argocd app wait spooliq-stg \
            --server ${ARGOCD_SERVER} \
            --auth-token ${ARGOCD_AUTH_TOKEN} \
            --grpc-web \
            --timeout 300

      - name: Notify success
        if: success()
        run: |
          DURATION=$((SECONDS))

          curl -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.N8N_API_TOKEN }}" \
            -d "{
              \"chatId\": \"${{ secrets.CHAT_ID }}\",
              \"threadId\": \"${{ secrets.THREAD_ID }}\",
              \"message\": \"✅ Spooliq Web Staging Deploy Success\n\n🚀 Version: ${{ steps.version.outputs.version }}\n📦 Commit: ${{ steps.version.outputs.short_sha }}\n👤 Author: ${{ github.actor }}\n🌐 URL: https://spooliq.stg.rodolfodebonis.com.br\n⏱️ Duration: ${DURATION}s\n📝 Message: ${{ github.event.head_commit.message }}\"
            }"

      - name: Notify failure
        if: failure()
        run: |
          DURATION=$((SECONDS))

          curl -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.N8N_API_TOKEN }}" \
            -d "{
              \"chatId\": \"${{ secrets.CHAT_ID }}\",
              \"threadId\": \"${{ secrets.THREAD_ID }}\",
              \"message\": \"❌ Spooliq Web Staging Deploy Failed\n\n🚀 Version: ${{ steps.version.outputs.version }}\n📦 Commit: ${{ steps.version.outputs.short_sha }}\n👤 Author: ${{ github.actor }}\n⏱️ Duration: ${DURATION}s\n📝 Message: ${{ github.event.head_commit.message }}\n\n🔗 Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }"
