name: Hotfix

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Hotfix version (leave empty for auto-increment)'
        required: false
        type: string
      description:
        description: 'Brief description of the hotfix'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-hotfix:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      hotfix_branch: ${{ steps.create_branch.outputs.branch }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Get current version from package.json
            CURRENT_VERSION=$(node -p "require('./package.json').version")

            # If no version in package.json, try getting from last tag
            if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" == "undefined" ]; then
              CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
            fi

            # Parse version components
            MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
            MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
            PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)

            # Increment patch version
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "New hotfix version: ${VERSION}"

      - name: Create hotfix branch
        id: create_branch
        run: |
          BRANCH="hotfix/v${{ steps.version.outputs.version }}"
          git checkout -b $BRANCH
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: |
          # npm version bumps both package.json and package-lock.json
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Commit version change
        run: |
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} for hotfix"

      - name: Create and push tag
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"

          echo "Creating hotfix tag $TAG..."
          git tag -a "$TAG" -m "Hotfix $TAG: ${{ inputs.description }}"

          echo "Pushing branch and tag..."
          git push origin ${{ steps.create_branch.outputs.branch }}
          git push origin "$TAG"

          echo "✓ Hotfix tag $TAG created and pushed"
          echo "✓ Branch ${{ steps.create_branch.outputs.branch }} pushed"

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh label create "hotfix" --color "D93F0B" --description "Urgent fix for production issues" --force
          gh label create "priority:critical" --color "B60205" --description "Critical priority" --force
          gh label create "automated" --color "BFD4F2" --description "Created by automation" --force

      - name: Create PR to main
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head ${{ steps.create_branch.outputs.branch }} \
            --title "🚨 Hotfix v${{ steps.version.outputs.version }}: ${{ inputs.description }}" \
            --label "hotfix,priority:critical,automated" \
            --body "$(cat <<EOF
          ## 🚨 Hotfix v${{ steps.version.outputs.version }}

          ### Description
          ${{ inputs.description }}

          ### Deployment Process
          1. ✅ This PR will be automatically deployed to **production** once merged
          2. 🏷️ Tag \`v${{ steps.version.outputs.version }}\` already created
          3. 🔄 A backport PR to \`develop\` will be created automatically after merge
          4. 📢 Notifications will be sent via n8n/Telegram

          ### Checklist
          - [ ] Code changes tested locally
          - [ ] No breaking changes introduced
          - [ ] Emergency fix validated
          - [ ] Ready for immediate production deployment

          ### Post-Merge Actions
          - Release workflow will automatically deploy to production
          - Backport PR will sync changes to develop branch

          ---
          🤖 _This PR was created automatically by the hotfix workflow_
          EOF
          )")

          echo "number=$(basename "$PR_URL")" >> $GITHUB_OUTPUT
          echo "url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Notify hotfix created
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_API_TOKEN: ${{ secrets.N8N_API_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          curl -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $N8N_API_TOKEN" \
            -d "{
              \"chatId\": \"$CHAT_ID\",
              \"threadId\": \"$THREAD_ID\",
              \"message\": \"🚨 Hotfix v${{ steps.version.outputs.version }} Created\n\n📋 Description: ${{ inputs.description }}\n🌿 Branch: ${{ steps.create_branch.outputs.branch }}\n👤 Created by: ${{ github.actor }}\n🔗 PR: $PR_URL\"
            }"
