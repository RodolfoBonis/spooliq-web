name: Hotfix

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Hotfix version (leave empty for auto-increment)'
        required: false
        type: string
      description:
        description: 'Brief description of the hotfix'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-hotfix:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      hotfix_branch: ${{ steps.create_branch.outputs.branch }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Get current version from package.json
            CURRENT_VERSION=$(node -p "require('./package.json').version")

            # If no version in package.json, try getting from last tag
            if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" == "undefined" ]; then
              CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
            fi

            # Parse version components
            MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
            MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
            PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)

            # Increment patch version
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "New hotfix version: ${VERSION}"

      - name: Create hotfix branch
        id: create_branch
        run: |
          BRANCH="hotfix/v${{ steps.version.outputs.version }}"
          git checkout -b $BRANCH
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Commit version change
        run: |
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} for hotfix"

      - name: Push hotfix branch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git push origin ${{ steps.create_branch.outputs.branch }}

      - name: Create PR to main
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head ${{ steps.create_branch.outputs.branch }} \
            --title "🚨 Hotfix v${{ steps.version.outputs.version }}: ${{ inputs.description }}" \
            --label "hotfix,priority:critical,automated" \
            --body "$(cat <<'EOF'
          ## 🚨 Hotfix v${{ steps.version.outputs.version }}

          ### Description
          ${{ inputs.description }}

          ### Deployment Process
          1. ✅ This PR will be automatically deployed to **production** once merged
          2. 🔄 A backport PR to \`develop\` will be created automatically
          3. 📢 Notifications will be sent via n8n/Telegram

          ### Checklist
          - [ ] Code changes tested locally
          - [ ] No breaking changes introduced
          - [ ] Emergency fix validated
          - [ ] Ready for immediate production deployment

          ### Post-Merge Actions
          - Release workflow will automatically deploy to production
          - Backport PR will sync changes to develop branch
          - Version tag will be created automatically

          ---
          🤖 _This PR was created automatically by the hotfix workflow_
          EOF
          )"

      - name: Create draft backport PR to develop
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Create a backport branch
          BACKPORT_BRANCH="backport/hotfix-v${{ steps.version.outputs.version }}-to-develop"

          git checkout develop
          git checkout -b $BACKPORT_BRANCH
          git cherry-pick ${{ steps.create_branch.outputs.branch }}
          git push origin $BACKPORT_BRANCH

          gh pr create \
            --base develop \
            --head $BACKPORT_BRANCH \
            --title "🔄 Backport hotfix v${{ steps.version.outputs.version }} to develop" \
            --label "backport,hotfix,automated" \
            --draft \
            --body "$(cat <<'EOF'
          ## 🔄 Backport Hotfix to Develop

          This PR backports hotfix v${{ steps.version.outputs.version }} from main to develop.

          ### Related PRs
          - Main PR: #${{ steps.pr.outputs.number }}

          ### Actions
          - [ ] Review changes
          - [ ] Resolve any conflicts
          - [ ] Approve and merge

          ---
          🤖 _This backport PR was created automatically_
          EOF
          )"

      - name: Notify hotfix created
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_API_TOKEN: ${{ secrets.N8N_API_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
        run: |
          curl -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $N8N_API_TOKEN" \
            -d "{
              \"chatId\": \"$CHAT_ID\",
              \"threadId\": \"$THREAD_ID\",
              \"message\": \"🚨 Hotfix v${{ steps.version.outputs.version }} Created\n\n📋 Description: ${{ inputs.description }}\n🌿 Branch: ${{ steps.create_branch.outputs.branch }}\n👤 Created by: ${{ github.actor }}\n🔗 PR: https://github.com/${{ github.repository }}/pulls\"
            }"

  deploy-hotfix:
    runs-on: ubuntu-latest
    needs: create-hotfix
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'hotfix/')
    steps:
      - name: Notify deployment started
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_API_TOKEN: ${{ secrets.N8N_API_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
        run: |
          echo "Hotfix merged - deployment will be handled by release.yaml workflow"

          curl -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $N8N_API_TOKEN" \
            -d "{
              \"chatId\": \"$CHAT_ID\",
              \"threadId\": \"$THREAD_ID\",
              \"message\": \"🚀 Hotfix Deployment Started\n\n📦 Version: ${{ needs.create-hotfix.outputs.version }}\n🌐 Production deployment in progress...\n⏳ Monitoring release workflow\"
            }"
