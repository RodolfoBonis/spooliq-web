name: Hotfix

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Hotfix version (leave empty for auto-increment)'
        required: false
        type: string
      description:
        description: 'Brief description of the hotfix'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-hotfix:
    runs-on: arc-spooliq-web
    outputs:
      version: ${{ steps.version.outputs.version }}
      hotfix_branch: ${{ steps.create_branch.outputs.branch }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Validate inputs
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ] && [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: version must match X.Y.Z (got: '$INPUT_VERSION')"
            exit 1
          fi
          echo "✓ Inputs validated"

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            # Get current version from package.json
            CURRENT_VERSION=$(node -p "require('./package.json').version")

            # If no version in package.json, try getting from last tag
            if [ -z "$CURRENT_VERSION" ] || [ "$CURRENT_VERSION" == "undefined" ]; then
              CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "0.0.0")
            fi

            # Parse version components
            MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
            MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
            PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)

            # Increment patch version
            PATCH=$((PATCH + 1))
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: computed version must match X.Y.Z (got: '$VERSION')"
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "New hotfix version: ${VERSION}"

      - name: Create hotfix branch
        id: create_branch
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BRANCH="hotfix/v${VERSION}"
          git checkout -b "$BRANCH"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Update package.json version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # npm version bumps both package.json and package-lock.json
          npm version "$VERSION" --no-git-tag-version

      - name: Commit version change
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${VERSION} for hotfix"

      - name: Create and push tag
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DESCRIPTION: ${{ inputs.description }}
          HOTFIX_BRANCH: ${{ steps.create_branch.outputs.branch }}
        run: |
          TAG="v${VERSION}"

          echo "Creating hotfix tag $TAG..."
          git tag -a "$TAG" -m "Hotfix $TAG: ${DESCRIPTION}"

          echo "Pushing branch and tag..."
          git push origin "$HOTFIX_BRANCH"
          git push origin "$TAG"

          echo "✓ Hotfix tag $TAG created and pushed"
          echo "✓ Branch $HOTFIX_BRANCH pushed"

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh label create "hotfix" --color "D93F0B" --description "Urgent fix for production issues" --force
          gh label create "priority:critical" --color "B60205" --description "Critical priority" --force
          gh label create "automated" --color "BFD4F2" --description "Created by automation" --force

      - name: Create PR to main
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DESCRIPTION: ${{ inputs.description }}
          HOTFIX_BRANCH: ${{ steps.create_branch.outputs.branch }}
        run: |
          # Build the PR body from a file so the description (free-form user
          # input) is never evaluated by the shell.
          {
            printf '## 🚨 Hotfix v%s\n\n' "$VERSION"
            printf '### Description\n'
            printf '%s\n' "$DESCRIPTION"
            printf '\n### Deployment Process\n'
            printf '1. ✅ This PR will be automatically deployed to **production** once merged\n'
            # shellcheck disable=SC2016
            printf '2. 🏷️ Tag `v%s` already created\n' "$VERSION"
            # shellcheck disable=SC2016
            printf '3. 🔄 A backport PR to `develop` will be created automatically after merge\n'
            printf '4. 📢 Notifications will be sent via n8n/Telegram\n'
            printf '\n### Checklist\n'
            printf -- '- [ ] Code changes tested locally\n'
            printf -- '- [ ] No breaking changes introduced\n'
            printf -- '- [ ] Emergency fix validated\n'
            printf -- '- [ ] Ready for immediate production deployment\n'
            printf '\n### Post-Merge Actions\n'
            printf -- '- Release workflow will automatically deploy to production\n'
            printf -- '- Backport PR will sync changes to develop branch\n'
            printf '\n---\n'
            printf '🤖 _This PR was created automatically by the hotfix workflow_\n'
          } > /tmp/pr_body.md

          PR_URL=$(gh pr create \
            --base main \
            --head "$HOTFIX_BRANCH" \
            --title "🚨 Hotfix v${VERSION}: ${DESCRIPTION}" \
            --label "hotfix,priority:critical,automated" \
            --body-file /tmp/pr_body.md)

          echo "number=$(basename "$PR_URL")" >> "$GITHUB_OUTPUT"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Notify hotfix created
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_API_TOKEN: ${{ secrets.N8N_API_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          THREAD_ID: ${{ secrets.THREAD_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          DESCRIPTION: ${{ inputs.description }}
          HOTFIX_BRANCH: ${{ steps.create_branch.outputs.branch }}
          ACTOR: ${{ github.actor }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          MESSAGE="🚨 Hotfix v${VERSION} Created\n\n📋 Description: ${DESCRIPTION}\n🌿 Branch: ${HOTFIX_BRANCH}\n👤 Created by: ${ACTOR}\n🔗 PR: ${PR_URL}"
          jq -n \
            --arg chatId "$CHAT_ID" \
            --arg threadId "$THREAD_ID" \
            --arg message "$MESSAGE" \
            '{chatId: $chatId, threadId: $threadId, message: $message}' \
          | curl -X POST "$N8N_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $N8N_API_TOKEN" \
              -d @- || echo "Notification failed (non-critical)"
