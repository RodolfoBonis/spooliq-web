name: Release with Docker - spooliq-web

permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v2.1.0)'
        required: true
        type: string
      version:
        description: 'Version without v prefix (e.g., 2.1.0)'
        required: true
        type: string

concurrency:
  group: release-production
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate version consistency
        id: validate
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Read version from package.json
          FILE_VERSION=$(jq -r .version package.json)

          # Verify tag format
          if [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Tag must be in format v1.2.3"
            echo "Got: $INPUT_TAG"
            exit 1
          fi

          # Extract version from tag
          TAG_VERSION=${INPUT_TAG#v}

          # Verify input version matches tag version
          if [ "$INPUT_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Input version ($INPUT_VERSION) doesn't match tag version ($TAG_VERSION)"
            exit 1
          fi

          # Verify package.json version matches tag version
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) doesn't match package.json ($FILE_VERSION)"
            echo ""
            echo "This means the tag was created with the wrong version!"
            echo "Expected: $FILE_VERSION"
            echo "Got: $TAG_VERSION"
            exit 1
          fi

          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"

          echo "✓ Version validated: $INPUT_VERSION"
          echo "✓ Tag validated: $INPUT_TAG"
          echo "✓ package.json matches: $FILE_VERSION"

  release:
    needs: validate
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    steps:
      - name: Record build start time
        run: echo "BUILD_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase repository owner
        id: repo-owner
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "lowercase=$REPO_OWNER" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.ecr.outputs.registry }}/rodolfobonis/spooliq-web:latest
            ${{ steps.ecr.outputs.registry }}/rodolfobonis/spooliq-web:${{ needs.validate.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            VERDACCIO_TOKEN=${{ secrets.VERDACCIO_TOKEN }}
            NEXT_PUBLIC_API_URL=https://api.spooliq.com/v1
            NEXT_PUBLIC_CLIENT_ID=${{ secrets.SPOOLIQ_CLIENT_ID }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          cat > release_notes.md <<EOF
          ## Changes in this Release
          - Docker image: \`${ECR_REGISTRY}/rodolfobonis/spooliq-web:${VERSION}\`
          - Automated release from the release workflow

          ### Docker Run Command
          \`\`\`bash
          docker run -p 3000:3000 \\
            -e API_URL=your_api_url \\
            -e NEXT_PUBLIC_CLIENT_ID=your_client_id \\
            ${ECR_REGISTRY}/rodolfobonis/spooliq-web:${VERSION}
          \`\`\`
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating notes"
            gh release edit "$TAG" --notes-file release_notes.md
          else
            gh release create "$TAG" \
              --title "Release $TAG" \
              --notes-file release_notes.md \
              --verify-tag
          fi

      - name: Checkout k3s manifest repository
        uses: actions/checkout@master
        with:
          repository: RodolfoBonis/k3s-apps
          ref: main
          path: k3s-manifest
          token: ${{ secrets.GH_TOKEN }}

      - name: Update K3s Manifests
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY_OWNER: ${{ steps.repo-owner.outputs.lowercase }}
        run: |
          cd k3s-manifest

          # Install yq if not available
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          # Update the image tag in the production values file (rb-stack format)
          yq e ".web-server.image.tag = \"${VERSION}\"" -i ./apps/spooliq-web/values-prod.yaml

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add ./apps/spooliq-web/values-prod.yaml
          git commit -m "chore(spooliq-web): update production image to ${VERSION}" || echo "No changes to commit"
          git push || echo "No changes to push"

      - name: Setup ArgoCD CLI
        uses: imajeetyadav/argocd-cli@v1

      - name: Sync ArgoCD
        run: |
          argocd app sync spooliq-prod \
            --grpc-web \
            --server ${{ secrets.ARGOCD_SERVER }} \
            --auth-token ${{ secrets.ARGOCD_TOKEN }}

          argocd app wait spooliq-prod \
            --server ${{ secrets.ARGOCD_SERVER }} \
            --auth-token ${{ secrets.ARGOCD_TOKEN }} \
            --grpc-web \
            --timeout 300

      - name: Calculate Build Duration
        id: build-duration
        run: |
          # BUILD_START_EPOCH is recorded as the first step of this job, so the
          # duration is reliable on workflow_dispatch (head_commit/pushed_at are not).
          START_EPOCH="${BUILD_START_EPOCH:-0}"
          END_EPOCH=$(date +%s)

          if [ "$START_EPOCH" -le 0 ]; then
            DURATION_SECONDS=0
          else
            DURATION_SECONDS=$((END_EPOCH - START_EPOCH))
          fi

          if [ "$DURATION_SECONDS" -lt 60 ]; then
            DURATION="${DURATION_SECONDS}s"
          elif [ "$DURATION_SECONDS" -lt 3600 ]; then
            MINUTES=$((DURATION_SECONDS / 60))
            SECS=$((DURATION_SECONDS % 60))
            DURATION="${MINUTES}m ${SECS}s"
          else
            HOURS=$((DURATION_SECONDS / 3600))
            MINUTES=$(((DURATION_SECONDS % 3600) / 60))
            SECS=$((DURATION_SECONDS % 60))
            DURATION="${HOURS}h ${MINUTES}m ${SECS}s"
          fi

          echo "duration=$DURATION" >> "$GITHUB_OUTPUT"

      - name: Notify n8n Success
        if: success()
        run: |
          curl -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.N8N_API_TOKEN }}" \
            -d "{
              \"chatId\": \"${{ secrets.CHAT_ID }}\",
              \"threadId\": \"${{ secrets.THREAD_ID }}\",
              \"message\": \"✅ Spooliq Web Production Deploy Success\n\n🚀 Version: ${{ needs.validate.outputs.version }}\n📦 Tag: ${{ needs.validate.outputs.tag }}\n👤 Author: ${{ github.actor }}\n🌐 URL: https://spooliq.com\n⏱️ Duration: ${{ steps.build-duration.outputs.duration }}\n🔗 Release: https://github.com/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}\"
            }"

      - name: Notify n8n Failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.N8N_API_TOKEN }}" \
            -d "{
              \"chatId\": \"${{ secrets.CHAT_ID }}\",
              \"threadId\": \"${{ secrets.THREAD_ID }}\",
              \"message\": \"❌ Spooliq Web Production Deploy Failed\n\n🚀 Version: ${{ needs.validate.outputs.version }}\n📦 Tag: ${{ needs.validate.outputs.tag }}\n👤 Author: ${{ github.actor }}\n⏱️ Duration: ${{ steps.build-duration.outputs.duration }}\n\n🔗 Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }"

  backport:
    needs: [validate, release]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh label create "backport" \
            --description "Backport changes to other branches" \
            --color "FBCA04" \
            --force 2>/dev/null || true

          gh label create "automated" \
            --description "Automatically created by workflows" \
            --color "E99695" \
            --force 2>/dev/null || true

          gh label create "auto-merge" \
            --description "Automatically merge when approved" \
            --color "0E8A16" \
            --force 2>/dev/null || true

      - name: Create backport to develop
        id: backport
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          # Setup git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Fetch develop
          git fetch origin develop:develop

          # Create backport branch from develop
          BACKPORT_BRANCH="backport/${TAG}-to-develop"
          git checkout -b "$BACKPORT_BRANCH" develop

          # Merge main into the backport branch. A conflict means develop has
          # diverged and needs manual reconciliation -- this must NOT fail the
          # release (the image is already published). Flag it and exit cleanly.
          if ! git merge origin/main --no-ff -m "chore: backport ${TAG} to develop"; then
            echo "::warning::Backport of ${TAG} to develop has merge conflicts; manual resolution required."
            git merge --abort || true
            gh issue create \
              --title "🔄 Backport ${TAG} to develop needs manual resolution" \
              --body "The automated backport of ${TAG} from main to develop has merge conflicts. Reconcile develop with main manually." \
              --label "backport" --label "automated" 2>/dev/null \
              || echo "Issue create skipped (may already exist)"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Clean merge -> push the backport branch and open the auto-merge PR
          git push origin "$BACKPORT_BRANCH"
          echo "created=true" >> "$GITHUB_OUTPUT"

          gh pr create \
            --base develop \
            --head "$BACKPORT_BRANCH" \
            --title "🔄 Backport ${TAG} to develop" \
            --body "$(cat <<EOF
          ## Automated Backport

          This PR backports release **${TAG}** from main to develop.

          ### Changes Included
          - Version bump to ${VERSION}
          - CHANGELOG updates
          - All features and fixes from the release

          ### Auto-merge
          This PR is labeled for auto-merge and will be merged automatically after:
          - ✓ All CI checks pass
          - ✓ No merge conflicts

          If there are conflicts, manual resolution is required.

          ---
          *Automated by release workflow*
          EOF
          )" \
            --label "backport" \
            --label "automated" \
            --label "auto-merge" || echo "PR creation failed or already exists"

      - name: Notify n8n backport created
        if: success() && steps.backport.outputs.created == 'true'
        run: |
          curl -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.N8N_API_TOKEN }}" \
            -d "{
              \"chatId\": \"${{ secrets.CHAT_ID }}\",
              \"threadId\": \"${{ secrets.THREAD_ID }}\",
              \"message\": \"🔄 Backport ${{ needs.validate.outputs.tag }} to develop created and labeled for auto-merge.\"
            }" || echo "Notification failed (non-critical)"
