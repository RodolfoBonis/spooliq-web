version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - node:20-alpine
    image: spooliq-web:latest
    container_name: spooliq-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080/v1}
      - NEXT_PUBLIC_CDN_API_KEY=${NEXT_PUBLIC_CDN_API_KEY}
    env_file:
      - .env.docker
    restart: unless-stopped
    networks:
      - spooliq-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {r.statusCode === 200 ? process.exit(0) : process.exit(1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  spooliq-network:
    driver: bridge
    name: spooliq-network